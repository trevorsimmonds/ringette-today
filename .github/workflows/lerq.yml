# Copies the LERQ schedules from Ringuette Québec into quebec.json every few
# hours. Free for public repositories. Run it by hand from the Actions tab
# ("Update LERQ schedule" → Run workflow).
name: Update LERQ schedule

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (UTC), at 17 minutes past
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: lerq
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download schedule
        run: node scripts/fetch-lerq.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- quebec.json && git ls-files --error-unmatch quebec.json >/dev/null 2>&1; then
            echo "No schedule changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quebec.json
            git commit -m "Update LERQ schedule"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
